name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: task secrets:check
      - name: hygiene
        env:
          HYGIENE_DENY: ${{ secrets.HYGIENE_DENY }}
        run: |
          if [ -n "$HYGIENE_DENY" ]; then
            printf '%s\n' "$HYGIENE_DENY" > "$RUNNER_TEMP/hygiene-deny"
            export HYGIENE_DENY_FILE="$RUNNER_TEMP/hygiene-deny"
          else
            echo "::warning::HYGIENE_DENY is not available, deny list skipped"
          fi
          task hygiene:check
