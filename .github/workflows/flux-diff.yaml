name: flux-diff

on:
  pull_request:

permissions: {}

jobs:
  flux-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.14
      - name: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo '### flate diff'
            echo '```diff'
            flate diff all --path kubernetes/flux --base "origin/$BASE_REF" --output diff 2>&1 || true
            echo '```'
          } > diff.md
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file diff.md --edit-last --create-if-none
