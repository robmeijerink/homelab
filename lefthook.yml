pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: mise exec -- gitleaks git --pre-commit --staged --redact --no-banner
    secrets:
      glob: "*.{yaml,yml}"
      run: mise exec -- scripts/check-secrets.sh {staged_files}
    hygiene:
      run: scripts/check-hygiene.sh {staged_files}
    tofu-fmt:
      glob: "*.tf"
      run: mise exec -- tofu fmt -check {staged_files}
