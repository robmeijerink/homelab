apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/local-path-storage/local-path-provisioner/app
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: local-path-storage
  sourceRef:
    kind: GitRepository
    name: flux-system
