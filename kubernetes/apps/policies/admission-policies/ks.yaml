apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: admission-policies
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/policies/admission-policies/app
  prune: true
  wait: true
  timeout: 5m
