apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: 2.10.1
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    size: small
    networkPolicy: true
  sync:
    kind: GitRepository
    url: https://github.com/robmeijerink/homelab.git
    ref: refs/heads/main
    path: kubernetes/flux/cluster
    interval: 1m
  kustomize:
    patches:
      - target:
          kind: Namespace
        patch: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: flux-system
            labels:
              pod-security.kubernetes.io/enforce: restricted
      - target:
          kind: Deployment
          name: (source-controller|helm-controller|notification-controller)
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: not-used
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 64Mi
      - target:
          kind: Deployment
          name: kustomize-controller
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: not-used
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 20m
                        memory: 128Mi
      - target:
          kind: Kustomization
        patch: |
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age
