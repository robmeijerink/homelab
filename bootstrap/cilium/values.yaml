cilium:
  ipam:
    mode: kubernetes
  routingMode: tunnel
  tunnelProtocol: vxlan
  kubeProxyReplacement: false
  cni:
    exclusive: true
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
  operator:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
  hubble:
    relay:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
